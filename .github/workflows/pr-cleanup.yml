name: PR Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      PR_VERSION: pr-${{ github.event.pull_request.number }}
      IMAGE_OWNER: hhankj2u
      BASE_PACKAGE_NAME: streammaster-builds
      FINAL_PACKAGE_NAME: streammaster
    steps:
      - name: Delete PR Images
        run: |
          # Delete all related images from ghcr.io/hhankj2u
          for suffix in "" "-base" "-build" "-sm"; do
            IMAGE_VERSION="${PR_VERSION}${suffix}"

            # Delete from streammaster-builds package
            gh api --method DELETE "/users/${IMAGE_OWNER}/packages/container/${BASE_PACKAGE_NAME}/versions/${IMAGE_VERSION}" || true

            # Delete from main streammaster package
            if [ -z "$suffix" ]; then
              gh api --method DELETE "/users/${IMAGE_OWNER}/packages/container/${FINAL_PACKAGE_NAME}/versions/${IMAGE_VERSION}" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
