name: Deploy Documentation

on:
  push:
    branches: ["main"]
    paths:
      - 'src/StreamMaster.Docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-i18n mkdocs-material mkdocs-static-i18n mkdocs-include-markdown-plugin mkdocs-material mkdocs-material-extensions

      - name: Build site with mkdocs
        run: |
          cd src/StreamMaster.Docs/streammaster
          mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'src/StreamMaster.Docs/streammaster/site/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
