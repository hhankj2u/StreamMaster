name: Shared Docker Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_all:
        type: boolean
        default: false
      build_base:
        type: boolean
        default: false
      build_build:
        type: boolean
        default: false
      build_sm:
        type: boolean
        default: false
      skip_release_main_build:
        type: boolean
        default: false
      release_as_latest:
        type: boolean
        default: false
    secrets:
      token:
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hhankj2u
  BASE_IMAGE_NAME: hhankj2u/streammaster-builds
  FINAL_IMAGE_NAME: hhankj2u/streammaster
  PLATFORMS: linux/amd64

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      branchName: ${{ steps.gitversion.outputs.branchName }}
      buildMeta: ${{ steps.gitversion.outputs.buildMetaData }}
      do_base: ${{ steps.flags.outputs.do_base }}
      do_build: ${{ steps.flags.outputs.do_build }}
      do_sm: ${{ steps.flags.outputs.do_sm }}
      do_final: ${{ steps.flags.outputs.do_final }}
      base_tag: ${{ steps.flags.outputs.base_tag }}
      build_tag: ${{ steps.flags.outputs.build_tag }}
      sm_tag: ${{ steps.flags.outputs.sm_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 0
          clean: true
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.8.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.token }}

      - name: Resolve build flags and image tags
        id: flags
        run: |
          set -euo pipefail
          DO_BASE=false
          DO_BUILD=false
          DO_SM=false
          DO_FINAL=true

          if [[ "${{ inputs.build_all }}" == "true" ]]; then
            DO_BASE=true
            DO_BUILD=true
            DO_SM=true
          else
            [[ "${{ inputs.build_base }}" == "true" ]] && DO_BASE=true
            [[ "${{ inputs.build_build }}" == "true" ]] && DO_BUILD=true
            [[ "${{ inputs.build_sm }}" == "true" ]] && DO_SM=true
          fi

          if [[ "${{ inputs.skip_release_main_build }}" == "true" ]]; then
            DO_FINAL=false
          else
            # Final image always needs an SM layer for this version
            DO_SM=true
          fi

          image_exists() {
            docker buildx imagetools inspect "$1" >/dev/null 2>&1
          }

          # Reuse floating :base / :build when present; otherwise build them this run
          if [[ "$DO_BASE" != "true" ]]; then
            if image_exists "${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:base"; then
              BASE_TAG="base"
            else
              echo "Floating :base missing — building base this run"
              DO_BASE=true
              BASE_TAG="${{ inputs.version }}-base"
            fi
          else
            BASE_TAG="${{ inputs.version }}-base"
          fi

          if [[ "$DO_BUILD" != "true" ]]; then
            if image_exists "${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:build"; then
              BUILD_TAG="build"
            else
              echo "Floating :build missing — building build-sdk this run"
              DO_BUILD=true
              BUILD_TAG="${{ inputs.version }}-build"
            fi
          else
            BUILD_TAG="${{ inputs.version }}-build"
          fi

          SM_TAG="${{ inputs.version }}-sm"

          {
            echo "do_base=$DO_BASE"
            echo "do_build=$DO_BUILD"
            echo "do_sm=$DO_SM"
            echo "do_final=$DO_FINAL"
            echo "base_tag=$BASE_TAG"
            echo "build_tag=$BUILD_TAG"
            echo "sm_tag=$SM_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: base=$DO_BASE ($BASE_TAG) build=$DO_BUILD ($BUILD_TAG) sm=$DO_SM final=$DO_FINAL"

  test:
    needs: [setup]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 1
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tests
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests
          provenance: false

  build-base:
    needs: [setup]
    if: needs.setup.outputs.do_base == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 1
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.token }}

      - name: Base - Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.base_tag }}
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          provenance: false

  build-build:
    needs: [setup]
    if: needs.setup.outputs.do_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 1
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.token }}

      - name: Build SDK - Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.build_tag }}
            ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:build
          cache-from: type=gha,scope=build-sdk
          cache-to: type=gha,mode=max,scope=build-sdk
          provenance: false

  build-sm:
    needs: [setup, build-build]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.do_sm == 'true' &&
      (needs.build-build.result == 'success' || needs.build-build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 1
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.token }}

      - name: Compose Dockerfile.sm
        run: |
          set -euo pipefail
          echo "FROM --platform=\$BUILDPLATFORM ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.build_tag }} AS build" > Dockerfile.sm
          cat Dockerfile.sm.template >> Dockerfile.sm

      - name: SM - Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.sm
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.sm_tag }}
          cache-from: type=gha,scope=sm-v2
          cache-to: type=gha,mode=max,scope=sm-v2
          provenance: false

  build-final:
    needs: [setup, test, build-base, build-sm]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.test.result == 'success' &&
      needs.setup.outputs.do_final == 'true' &&
      needs.build-sm.result == 'success' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}
          fetch-depth: 1
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.token }}

      - name: Compose final Dockerfile and tags
        id: meta
        run: |
          set -euo pipefail
          {
            echo "FROM ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.sm_tag }} AS sm"
            echo "FROM ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.base_tag }} AS base"
            cat Dockerfile.template
          } > Dockerfile

          TAGS="${{ env.REGISTRY }}/${{ env.FINAL_IMAGE_NAME }}:${{ inputs.version }}"
          if [[ "${{ inputs.release_as_latest }}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.FINAL_IMAGE_NAME }}:latest"
          else
            BRANCH_TAG=$(echo "${{ needs.setup.outputs.branchName }}" | tr '/' '-')
            TAGS="${TAGS}"$'\n'"${{ env.REGISTRY }}/${{ env.FINAL_IMAGE_NAME }}:${BRANCH_TAG}"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Final - Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=final
          cache-to: type=gha,mode=max,scope=final
          provenance: false
